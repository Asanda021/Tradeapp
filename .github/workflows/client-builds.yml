name: Client Builds

on:
  push:
    branches: [main]
    paths:
      - "clients/**"
      - ".github/workflows/client-builds.yml"
  pull_request:
    branches: [main]
    paths:
      - "clients/**"
      - ".github/workflows/client-builds.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Windows client
        shell: pwsh
        run: |
          python -m py_compile clients/windows/app.py
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --noconsole --name Tradeapp clients/windows/app.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradeapp-windows
          path: dist/Tradeapp.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build Android debug APK
        working-directory: clients/android
        run: gradle --no-daemon assembleDebug
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradeapp-android-debug
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
